[theme]
base = "light"
primaryColor = "#184B9C"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#F1F5FB"
borderColor = "#C9D6EE"
showWidgetBorder = true
baseRadius = "10px"
textColor = "#0E2C68"
font = "sans serif"

[server]
headless = true
# CORS and XSRF protection stay ON (Streamlit defaults). Do not disable them.

[client]
showErrorDetails = false
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
